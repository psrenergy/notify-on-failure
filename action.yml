name: "Notify on Failure"
description: "Posts a workflow failure notification to a Slack channel via slackapi/slack-github-action"
branding:
  icon: "bell"
  color: "red"

inputs:
  token:
    description: "Slack bot user OAuth token"
    required: true
  channel:
    description: "Slack channel ID"
    required: true

runs:
  using: "composite"
  steps:
    - name: Post failure message to Slack
      uses: slackapi/slack-github-action@v2
      with:
        method: chat.postMessage
        token: ${{ inputs.token }}
        payload: |
          channel: "${{ inputs.channel }}"
          text: "<!channel> publish failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
