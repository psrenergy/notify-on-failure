name: "Notify on Failure"
description: "Posts a workflow failure notification to a Slack channel via slackapi/slack-github-action"
branding:
  icon: "bell"
  color: "red"

inputs:
  token:
    description: "Slack bot user OAuth token (typically secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN)"
    required: true
  channel:
    description: "Slack channel ID (e.g. C0B43HDAPKQ) — use the ID, not the channel name"
    required: true

runs:
  using: "composite"
  steps:
    - name: Post failure message to Slack
      uses: slackapi/slack-github-action@v2
      with:
        method: chat.postMessage
        token: ${{ inputs.token }}
        payload: |
          channel: "${{ inputs.channel }}"
          text: "Workflow failed: ${{ github.workflow }}"
          blocks:
            - type: "section"
              text:
                type: "mrkdwn"
                text: "@channel <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} failed>"
